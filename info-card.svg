      <text x="0" y="56" fill="#7ee787" font-family="ui-monospace, Consolas, monospace" font-size="11.5px" font-weight="500" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.5s" fill="freeze" />
