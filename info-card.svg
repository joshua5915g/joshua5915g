      </text>
      <text x="0" y="42" fill="#8b949e" font-family="ui-monospace, Consolas, monospace" font-size="11.5px" font-weight="500" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.44s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
