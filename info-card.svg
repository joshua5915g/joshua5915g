<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" width="460" height="540">
  <defs>
    <!-- Dark Gradient -->
    <linearGradient id="info-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>

    <!-- Border Gradient with Neon accents -->
    <linearGradient id="info-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#39d353" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ff9800" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.9" />
    </linearGradient>

    <filter id="info-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Energy Meter Glow -->
    <filter id="meter-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .info-window {
      fill: url(#info-bg);
      stroke: url(#info-border);
      stroke-width: 1.2;
      rx: 12px;
    }
    .title-bar {
      fill: #161b22;
    }
    .title-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      fill: #8b949e;
      font-weight: 500;
    }
    .ascii-art {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      white-space: pre;
    }
    .sec-header {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .entry-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .entry-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
    }
    .swatch-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9.5px;
      fill: #8b949e;
    }
  </style>

  <!-- Main Card Surface -->
  <rect x="1" y="1" width="458" height="538" class="info-window" />

  <!-- Window Title Bar -->
  <path d="M 1 13 A 12 12 0 0 1 13 1 L 447 1 A 12 12 0 0 1 459 13 L 459 34 L 1 34 Z" class="title-bar" />
  <line x1="1" y1="34" x2="459" y2="34" stroke="#30363d" stroke-width="0.8" />

  <!-- macOS Window Controls -->
  <circle cx="18" cy="17" r="5.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="36" cy="17" r="5.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="54" cy="17" r="5.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <text x="230.0" y="21" text-anchor="middle" class="title-text">joshua@cyberdeck: neofetch</text>

  <!-- Top Neofetch Header Banner -->
  <g transform="translate(22, 52)">
    <!-- Mini ASCII Distro Logo on Left -->
    <g class="ascii-art">
      <text x="0" y="0" fill="#00f0ff" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.2s" fill="freeze" />
           /\       
      </text>
      <text x="0" y="14" fill="#00f0ff" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.26s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.26s" fill="freeze" />
          /  \      
      </text>
      <text x="0" y="28" fill="#39d353" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.32s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.32s" fill="freeze" />
         / /\ \     
      </text>
      <text x="0" y="42" fill="#39d353" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.38s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.38s" fill="freeze" />
        / /__\ \    
      </text>
      <text x="0" y="56" fill="#58a6ff" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.44s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.44s" fill="freeze" />
        \/    \/    
      </text>
    </g>

    <!-- Meta Header details on Right -->
    <g transform="translate(105, 0)">
      <text x="0" y="0" fill="#f0f6fc" font-family="ui-monospace, Consolas, monospace" font-size="11.5px" font-weight="700" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.26s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.26s" fill="freeze" />
        joshua@cyberdeck
      </text>
      <text x="0" y="14" fill="#30363d" font-family="ui-monospace, Consolas, monospace" font-size="11.5px" font-weight="500" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0, 8; 0, 0" dur="0.22s" begin="0.32s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" />
        <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="0.32s" fill="freeze" />
        -----------------------
