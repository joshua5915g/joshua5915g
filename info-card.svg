      <animate attributeName="opacity" values="0; 1" dur="0.22s" begin="1.1s" fill="freeze" />
      <text x="0" y="98" fill="#39d353" class="sec-header">■ CORE ARSENAL</text>
      <line x1="90" y1="95" x2="416" y2="95" stroke="#30363d" stroke-dasharray="3 3" stroke-width="0.8" />
